name: Sync VetMeds dataset

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vetmeds-dataset
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and validate the published snapshot
        shell: bash
        run: |
          source=https://hrabosh.github.io/vetmeds/data/v1
          download="$(mktemp -d)"
          trap 'rm -rf -- "$download"' EXIT
          curl_options=(--fail --silent --show-error --proto '=https' --retry 2 --max-time 45)
          curl "${curl_options[@]}" "$source/metadata.json" -o "$download/metadata.json"
          snapshot="$(jq -er '.snapshot_id | select(type == "string" and test("^[a-f0-9]{64}$"))' "$download/metadata.json")"
          for file in preparations packages changes classification; do
            curl "${curl_options[@]}" "$source/$file.json?snapshot=$snapshot" -o "$download/$file.json"
          done
          jq -en --arg id "$snapshot" \
            --slurpfile metadata "$download/metadata.json" \
            --slurpfile preparations "$download/preparations.json" \
            --slurpfile packages "$download/packages.json" \
            --slurpfile changes "$download/changes.json" \
            --slurpfile classification "$download/classification.json" '
              [$metadata, $preparations, $packages, $changes, $classification]
              | all(length == 1 and .[0].schema_version == 1 and .[0].snapshot_id == $id)
                and ($preparations[0].preparations | type == "array" and length == $metadata[0].counts.preparations)
                and ($packages[0].packages | type == "array" and length == $metadata[0].counts.packages)
                and ($changes[0].events | type == "array" and length == $metadata[0].counts.changes)
            ' > /dev/null
          curl "${curl_options[@]}" "$source/registration-events.json" -o "$download/registration-events.json"
          jq -e '
              .schema_version == 1
              and (.source.issue | type == "string" and length > 0)
              and (.source.url | startswith("https://www.uskvbl.cz/attachments/") and endswith(".pdf"))
              and (.source.sha256 | test("^[a-f0-9]{64}$"))
              and (.events | type == "array" and length > 0 and all(
                  .type == "registration_cancelled"
                  and (.registration_number | type == "string" and length > 0)
                  and (.name | type == "string" and length > 0)
                  and (.occurred_in | test("^[0-9]{4}-(0[1-9]|1[0-2])$"))
                  and (.source_page | type == "number" and . >= 1 and floor == .)
              ))
          ' "$download/registration-events.json" > /dev/null
          observed_at="$(jq -er '.observed_at | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))' "$download/metadata.json")"
          python3 tools/preparations.py build "$download" "$download/by-preparation"
          mkdir -p v1/by-preparation
          rsync -a --delete "$download/by-preparation/" v1/by-preparation/
          git add -A -- v1/by-preparation
          for file in metadata.json preparations.json packages.json changes.json classification.json registration-events.json; do
            install -D -m 644 -- "$download/$file" "v1/$file"
            git add -- "v1/$file"
          done
          if git diff --cached --quiet; then
            echo 'Dataset unchanged.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish VetMeds snapshot ${snapshot:0:12}" \
            -m "Snapshot-ID: $snapshot
          Observed-At: $observed_at"
          git push origin HEAD:main
